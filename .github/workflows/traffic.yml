name: GitHub Traffic Stats for All Repos

on:
  schedule:
    - cron: '0 1 * * *'   # Runs every day at 1:00 AM UTC
  workflow_dispatch:      # Lets you run manually

jobs:
  update-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Collect traffic stats for all repos
        uses: zhaohongxuan/traffic-statistics-action@v2   # Updated to v2
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # Use a personal access token
          repos: |
            PRASAD005-BOT/PRASAD005-BOT
            PRASAD005-BOT/vidya

      - name: Commit and push
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add .
          git commit -m "Update traffic stats" || echo "No changes"
          git push
